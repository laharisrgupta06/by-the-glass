<header>
    @if (eyebrow) {
        <p class="eyebrow">{{ eyebrow }}</p>
    }
    <h1>{{ recipe.name }}</h1>
    <!-- Favourite control goes here once favourites are backed by accounts. -->
</header>

@if (facts.length) {
    <dl class="facts">
        @for (fact of facts; track fact.label) {
            <div>
                <dt>{{ fact.label }}</dt>
                <dd>{{ fact.value }}</dd>
            </div>
        }
    </dl>
}
