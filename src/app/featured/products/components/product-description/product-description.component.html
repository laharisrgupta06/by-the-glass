<header>
    @if (eyebrow) {
        <p class="eyebrow">{{ eyebrow }}</p>
    }
    <div class="title">
        <h1>{{ recipe.name }}</h1>
        <app-favorite-button [drink]="recipe" variant="labelled"></app-favorite-button>
    </div>
</header>

@if (facts.length) {
    <dl class="facts">
        @for (fact of facts; track fact.label) {
            <div>
                <dt>{{ fact.label }}</dt>
                <dd>{{ fact.value }}</dd>
            </div>
        }
    </dl>
}
